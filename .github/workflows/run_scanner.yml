name: Auto Scan Crypto LONG 15 Min

on:
  schedule:
    - cron: '*/15 * * * *' # Berjalan otomatis setiap 15 menit
  workflow_dispatch: # Agar bisa ditekan/run manual dari menu Actions GitHub

jobs:
  run-long-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install ccxt pandas requests

      - name: Run Scanner Script
        run: |
          python scanner.py
