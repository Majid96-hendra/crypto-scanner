name: Pantau Koin

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pantau-koin
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - name: Pantau koin dan kirim ke Telegram
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SOURCE: bitget
          COIN: ""
          MODAL_USDT: "100"
          RISK_PCT: "2"
        run: python3 coin_bot.py scan

      - name: Simpan state
        run: |
          git config user.name "radar-bot"
          git config user.email "radar-bot@users.noreply.github.com"
          git add coin_state.json
          git diff --cached --quiet || (git commit -m "update state" && git pull --rebase origin main && git push)
